<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daddy & Daughter Projects</title>
  <link rel="stylesheet" href="shared/styles/main.css">
  <style>
    header { text-align: center; padding: 30px 0 10px; }
    header h1 { font-size: 2.6rem; margin: 0; }
    header p { color: var(--muted); font-size: 1.2rem; }

    .filters { text-align: center; margin: 10px 0 24px; }
    .filters button { margin: 4px; background: var(--secondary); padding: 8px 16px; font-size: 1rem; }
    .filters button.active { background: var(--primary); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    .project {
      text-decoration: none;
      color: var(--text);
      transition: transform 0.15s;
    }
    .project:hover { transform: translateY(-4px) rotate(-1deg); }
    .project .emoji { font-size: 3rem; }
    .project h2 { margin: 8px 0 4px; font-size: 1.4rem; }
    .project .meta { color: var(--muted); font-size: 0.9rem; }
    .tag {
      display: inline-block;
      background: var(--accent);
      border-radius: 10px;
      padding: 2px 10px;
      font-size: 0.85rem;
      margin-top: 8px;
    }
    footer { text-align: center; color: var(--muted); padding: 40px 0 20px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🌈 Daddy & Daughter Projects</h1>
      <p>Games, puzzles and experiments we built together</p>
    </header>

    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>

    <footer>Made with ❤️ together</footer>
  </main>

  <script src="projects-list.js"></script>
  <script>
    const grid = document.getElementById("grid");
    const filters = document.getElementById("filters");

    function show(category) {
      grid.innerHTML = "";
      PROJECTS
        .filter(p => category === "All" || p.category === category)
        .forEach(p => {
          const a = document.createElement("a");
          a.className = "project card";
          a.href = p.folder + "/index.html";
          a.innerHTML = `
            <div class="emoji">${p.emoji}</div>
            <h2>${p.title}</h2>
            <div>${p.description}</div>
            <div class="meta">${p.date}</div>
            <span class="tag">${p.category}</span>`;
          grid.appendChild(a);
        });

      document.querySelectorAll(".filters button").forEach(b =>
        b.classList.toggle("active", b.textContent === category));
    }

    const categories = ["All", ...new Set(PROJECTS.map(p => p.category))];
    categories.forEach(c => {
      const b = document.createElement("button");
      b.textContent = c;
      b.onclick = () => show(c);
      filters.appendChild(b);
    });

    show("All");
  </script>
</body>
</html>

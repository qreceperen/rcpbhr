<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess the Number</title>
  <link rel="stylesheet" href="../../shared/styles/main.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <a class="back-link" href="../../index.html">← All projects</a>

    <h1>🔢 Guess the Number</h1>

    <div class="card">
      <p>I'm thinking of a number between <b>1</b> and <b>100</b>. Can you guess it?</p>

      <input type="number" id="guess" min="1" max="100" placeholder="Your guess">
      <button id="guess-button">Guess!</button>

      <p id="hint">🤔</p>
      <p id="tries">Tries: 0</p>

      <button id="restart" hidden>Play again 🔄</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
